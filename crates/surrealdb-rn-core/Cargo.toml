[package]
name = "surrealdb-rn-core"
version = "0.1.0-alpha.4.haus.20261019.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust and UniFFI core for react-native-surrealdb"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = ["engine-mem", "engine-surrealkv", "protocol-ws"]
engine-mem = ["surrealdb/kv-mem"]
engine-surrealkv = ["surrealdb/kv-surrealkv"]
protocol-ws = ["surrealdb/protocol-ws", "surrealdb/rustls"]
# Bundles a pinned SurrealDB 3.x reader so SurrealKV stores written by 3.x can be
# exported and re-imported on first open (4.x refuses to open them directly).
# Off by default: it adds roughly 8 MiB to the native library. Build with
# packages/react-native-surrealdb/scripts/with-migrate-from-3x.sh to include it.
migrate-from-3x = ["engine-surrealkv", "dep:surrealdb_v3", "dep:surrealdb_core_v3"]

[dependencies]
base64 = "0.22.1"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
surrealdb = { version = "=4.0.1", default-features = false }
surrealdb_v3 = { package = "surrealdb", version = "=3.2.4", default-features = false, features = ["kv-surrealkv"], optional = true }
# Pin the 3.x engine itself: surrealdb 3.2.4 otherwise resolves a newer 3.x core.
surrealdb_core_v3 = { package = "surrealdb-core", version = "=3.2.4", default-features = false, optional = true }
surrealdb-sync-client = { path = "../surrealdb-sync-client" }
surrealdb-sync-protocol = { path = "../surrealdb-sync-protocol" }
thiserror = "2.0.17"
tokio = { version = "1.52.0", features = ["macros", "rt", "sync", "time"] }
uniffi = { version = "0.31.0", features = ["tokio"] }

[dev-dependencies]
temp-dir = "0.1.16"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread", "time"] }
