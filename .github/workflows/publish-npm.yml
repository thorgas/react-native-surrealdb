name: Publish tested package to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tested GitHub release tag
        required: true
        type: string
      dist_tag:
        description: npm distribution channel
        required: true
        type: choice
        options:
          - next
          - latest
      publish_github_release:
        description: Publish the draft GitHub release after npm succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish approved tarball
    runs-on: ubuntu-latest
    environment: npm-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Remove deprecated npm configuration
        run: sed -i '/^always-auth=/d' "$NPM_CONFIG_USERCONFIG"
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.5.1
      - name: Download tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --pattern "*.tgz" \
            --pattern "SHA256SUMS"
      - name: Verify release asset and channel
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
          DIST_TAG: ${{ inputs.dist_tag }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          TARBALL=$(find . -maxdepth 1 -name '*.tgz' -type f -print -quit)
          test -n "$TARBALL"
          tar -xOf "$TARBALL" package/package.json > package.json
          node -e '
            const pkg = require("./package.json");
            const prerelease = pkg.version.includes("-");
            const expectedChannel = prerelease ? "next" : "latest";
            if (pkg.name !== "react-native-surrealdb") throw new Error("unexpected package name");
            if (pkg.version !== process.env.EXPECTED_TAG) throw new Error("tarball version does not match release tag");
            if (process.env.DIST_TAG !== expectedChannel) throw new Error(`${pkg.version} must publish to ${expectedChannel}`);
            if (pkg.publishConfig?.tag !== expectedChannel) throw new Error("publishConfig tag does not match release channel");
            if (pkg.repository?.url !== "git+https://github.com/thorgas/react-native-surrealdb.git") {
              throw new Error("unexpected package repository");
            }
          '
      - name: Publish exact tested tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL=$(find "$GITHUB_WORKSPACE/release" -maxdepth 1 -name '*.tgz' -type f -print -quit)
          test -n "$TARBALL"
          npm publish "$TARBALL" \
            --access public \
            --tag "${{ inputs.dist_tag }}" \
            --ignore-scripts \
            --provenance
      - name: Verify npm publication
        run: |
          npm view "react-native-surrealdb@${{ inputs.release_tag }}" \
            name version dist-tags dist.tarball dist.fileCount dist.unpackedSize
      - name: Publish stable GitHub release
        if: inputs.dist_tag == 'latest' && inputs.publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --latest
